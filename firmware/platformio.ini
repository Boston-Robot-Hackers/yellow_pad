; Yellow Pad: BLE gamepad for ROS teleop on the ESP32-2432S028R ("Cheap Yellow Display")
;
; Two designs share these settings; each env builds one source file.
;   cyd     tabbed design (Drive / Settings), src/main.cpp     (default)
;   cyd_v1  first design (arrows + % speed panel), src/arrows_v1.cpp

[platformio]
default_envs = cyd

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lemmingdev/ESP32-BLE-Gamepad@0.8.0
    h2zero/NimBLE-Arduino@2.5.1

build_flags =
    ; TFT_eSPI setup for the CYD's ILI9341 on the HSPI bus
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
build_src_filter = +<main.cpp>

[env:cyd_v1]
build_src_filter = +<arrows_v1.cpp>
